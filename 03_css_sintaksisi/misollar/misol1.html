<!DOCTYPE html>
<html lang="uz">
<head>
    <!-- 3-bob: CSS selektorlar — element, class, id -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selektorlar</title>
    <link rel="stylesheet" href="misol1.css">
</head>
<body>
    <h1>CSS Selektorlar</h1>

    <!-- Element selektori -->
    <p>Bu oddiy paragraf — element selektori bilan bezalgan.</p>

    <!-- Class selektori -->
    <p class="muhim">Bu muhim matn — .muhim class selektori.</p>
    <p class="muhim">Bu ham muhim matn.</p>

    <!-- ID selektori -->
    <p id="maxsus">Bu maxsus matn — #maxsus id selektori.</p>

    <!-- Kombinatsiya -->
    <div class="karta">
        <h2>Karta sarlavhasi</h2>
        <p>Karta matni — ichki selektor (descendant).</p>
    </div>

    <div class="karta">
        <h2>Ikkinchi karta</h2>
        <p>Yana bir karta matni.</p>
    </div>
</body>
</html>
