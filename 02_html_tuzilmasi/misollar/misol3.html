<!DOCTYPE html>
<html lang="uz">
<head>
    <!-- 2-bob: Forma elementlari — ro'yxatdan o'tish formasi -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Formalar</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        form { max-width: 500px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 30px; background-color: #1565c0; color: white; border: none; cursor: pointer; border-radius: 4px; }
        fieldset { border: 1px solid #ccc; padding: 15px; border-radius: 5px; }
        legend { font-weight: bold; color: #1565c0; }
    </style>
</head>
<body>
    <h1>Ro'yxatdan o'tish formasi</h1>

    <form action="#" method="POST">
        <fieldset>
            <legend>Shaxsiy ma'lumotlar</legend>

            <label for="ism">Ism:</label>
            <input type="text" id="ism" name="ism" placeholder="Ismingizni kiriting" required>

            <label for="familiya">Familiya:</label>
            <input type="text" id="familiya" name="familiya" placeholder="Familiyangizni kiriting" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="email@misol.uz" required>

            <label for="tel">Telefon:</label>
            <input type="tel" id="tel" name="tel" placeholder="+998 90 123 45 67">

            <label for="tug_sana">Tug'ilgan sana:</label>
            <input type="date" id="tug_sana" name="tug_sana">

            <label for="parol">Parol:</label>
            <input type="password" id="parol" name="parol" minlength="6" required>
        </fieldset>

        <fieldset>
            <legend>Qo'shimcha</legend>

            <label for="fakultet">Fakultet:</label>
            <select id="fakultet" name="fakultet">
                <option value="">Tanlang...</option>
                <option value="fizmat">Fizika-matematika</option>
                <option value="tabiiy">Tabiiy fanlar</option>
                <option value="filologiya">Filologiya</option>
            </select>

            <label for="kurs">Kurs:</label>
            <input type="number" id="kurs" name="kurs" min="1" max="4" value="1">

            <label>Jinsi:</label>
            <input type="radio" name="jins" value="erkak" id="erkak">
            <label for="erkak" style="display:inline;">Erkak</label>
            <input type="radio" name="jins" value="ayol" id="ayol">
            <label for="ayol" style="display:inline;">Ayol</label>

            <label for="izoh">Izoh:</label>
            <textarea id="izoh" name="izoh" rows="4" placeholder="Qo'shimcha ma'lumot..."></textarea>

            <label>
                <input type="checkbox" name="rozilik" required>
                Shartlar bilan roziman
            </label>
        </fieldset>

        <button type="submit">Ro'yxatdan o'tish</button>
    </form>
</body>
</html>
